[package]
name = "ic-surface-gtk"
version = "0.1.0"
edition = "2021"
description = "A window of its own on the desktop, a full-height page over the main window on a phone"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
gtk = { package = "gtk4", version = "0.9", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.7", features = ["v1_6"] }
