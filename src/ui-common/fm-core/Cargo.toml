[package]
name = "fm-core"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
common = { workspace = true }
async-trait = "0.1"
ic-plugin-api = { workspace = true }
uuid = { version = "1.7", features = ["v4", "fast-rng"] }
tokio = { version = "1.36", features = ["rt", "sync"] }
ic-platform = { workspace = true }

[dev-dependencies]
futures = "0.3"
tokio = { version = "1.36", features = ["rt", "macros"] }
