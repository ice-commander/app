[package]
name = "gtk-fm-ui"
version = "0.1.286"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
gtk = { package = "gtk4", version = "0.9", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.7", features = ["v1_6"] }
relm4 = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
client-config = { workspace = true }
client-archives = { workspace = true, optional = true }
chrono = "0.4"
ic-i18n = { workspace = true }
fm-core = { workspace = true }
once_cell = "1.19"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
resvg = "0.47"

[features]
default = []
support-archives = ["dep:client-archives"]

[build-dependencies]
glib-build-tools = "0.20"
