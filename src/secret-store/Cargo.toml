[package]
name = "secret-store"
version = "0.1.0"
edition = "2021"
description = "Machine-bound encryption-at-rest for connection secrets + password-protected export blobs"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "secret_store"
path = "src/lib.rs"

[dependencies]
machine-uid = "0.5"
hkdf = "0.12"
sha2 = "0.10"
chacha20poly1305 = "0.10"
argon2 = "0.5"
base64 = "0.22"
rand = { workspace = true }
dirs = "6.0.0"
serde_json = { workspace = true }
