[package]
name = "ic-platform"
version = "0.1.0"
edition = "2021"
description = "Local platform services: filesystem, pseudo-terminal, registry"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
ic-model = { workspace = true }
tokio = { workspace = true, features = ["full"] }
portable-pty = "0.9.0"
chrono = "0.4"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.52"

[dev-dependencies]
tempfile = "3"
