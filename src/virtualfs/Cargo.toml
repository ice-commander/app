[package]
name = "virtualfs"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

# All the filesystem providers behind the `FileSystemRpc` trait — local disk,
# archives (zip/tar), the drives-root listing, and (feature-gated) the network
# mounts. One home the GTK app, panel-router and the headless backend all draw
# from. Still depends on gtk_fm_ui for now; the GTK-free split lands with headless.
[dependencies]
gtk = { package = "gtk4", version = "0.9", features = ["v4_12"], optional = true }
adw = { package = "libadwaita", version = "0.7", features = ["v1_6"], optional = true }
common = { workspace = true }
client-config = { workspace = true }
client-archives = { workspace = true }
ic-platform = { workspace = true }
ic-logging = { workspace = true }
fm-core = { workspace = true }
gtk-fm-ui = { workspace = true, optional = true }
tokio = { version = "1.36", features = ["full", "rt-multi-thread"] }
uuid = { version = "1.8", features = ["v4", "v5"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
tar = "0.4.40"
bzip2 = "0.4.4"
zip = "0.6.6"
flate2 = "1.0.30"
kamadak-exif = "0.5"
dirs = "6.0.0"
ic-i18n = { workspace = true }
ssh2 = { version = "0.9.5", features = ["vendored-openssl"] }
# for the lifted FTP/SFTP/WebDAV clients
suppaftp = "8.0.2"
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls", "stream"] }
serde = { workspace = true, features = ["derive"] }
futures-util = "0.3"
bytes = { workspace = true }

[features]
default = ["gtk"]
# GTK presentation half: the `gtk_fm_ui::FileSystemRpc` impls (thumbnails,
# on_item_bound, mount dialogs) and the gio-backed drive enumeration. Off = the
# providers expose only the GTK-free `fm_core` data trait (headless).
gtk = ["dep:gtk", "dep:adw", "dep:gtk-fm-ui"]
