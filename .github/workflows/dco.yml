name: DCO

# Every commit in a pull request must carry a Signed-off-by line matching its
# author, certifying the Developer Certificate of Origin (see DCO and
# CONTRIBUTING.md). This project uses DCO instead of a CLA.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  sign-off:
    name: Check sign-off
    # Hosted runner on purpose: the check has to work even when the
    # self-hosted build machine is offline. It costs nothing on a public repo.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify Signed-off-by on every commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # The base commit may not be an ancestor of the head branch if the
          # target branch moved on after the branch point.
          git fetch --no-tags origin "$BASE" >/dev/null 2>&1 || true

          commits=$(git rev-list --no-merges "$BASE".."$HEAD")
          if [ -z "$commits" ]; then
            echo "No non-merge commits to check."
            exit 0
          fi

          failed=0
          for sha in $commits; do
            short=$(git rev-parse --short "$sha")
            subject=$(git show -s --format='%s' "$sha")
            name=$(git show -s --format='%an' "$sha")
            email=$(git show -s --format='%ae' "$sha")
            signoffs=$(git show -s --format='%(trailers:key=Signed-off-by,valueonly)' "$sha")

            if printf '%s\n' "$signoffs" | grep -qiF "<$email>"; then
              echo "ok    $short  $subject"
            else
              echo "FAIL  $short  $subject"
              echo "        expected: Signed-off-by: $name <$email>"
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            echo
            echo "One or more commits are missing a matching Signed-off-by line."
            echo "Fix the last commit with:   git commit --amend -s"
            echo "Fix a whole branch with:    git rebase --signoff $BASE"
            echo "Then force-push the branch. See CONTRIBUTING.md."
            exit 1
          fi

          echo
          echo "All commits are signed off."
